<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>REDEEM CODE</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap');

:root{
    --green:#00ff88;
    --red:#ff1744;
    --black:#030504;
    --card:#0a100c;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:grid;

    place-items:center;

    background:
        radial-gradient(circle at 20% 20%,rgba(0,255,136,.12),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(255,23,68,.12),transparent 30%),
        #030504;

    color:white;

    font-family:'Kanit',sans-serif;

    overflow:hidden;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    opacity:.12;

    background-image:
        linear-gradient(rgba(0,255,136,.2) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,136,.2) 1px,transparent 1px);

    background-size:40px 40px;

}

.container{

    width:min(620px,calc(100% - 30px));

    position:relative;

    z-index:2;

}

.card{

    background:rgba(7,12,9,.92);

    border:1px solid rgba(0,255,136,.35);

    border-radius:30px;

    padding:40px;

    box-shadow:
        0 0 80px rgba(0,255,136,.12),
        inset 0 0 60px rgba(0,255,136,.025);

    backdrop-filter:blur(20px);

    animation:enter .6s cubic-bezier(.2,.8,.2,1);

}

@keyframes enter{

    from{
        opacity:0;
        transform:translateY(40px) scale(.95);
    }

    to{
        opacity:1;
        transform:none;
    }

}

h1{

    font-family:'Orbitron';

    text-align:center;

    color:var(--green);

    text-shadow:
        0 0 15px rgba(0,255,136,.7);

}

.subtitle{

    text-align:center;

    color:#789085;

    margin-bottom:30px;

}

label{

    display:block;

    margin-bottom:8px;

    color:#a7b9af;

}

textarea{

    width:100%;

    min-height:130px;

    resize:none;

    background:#050805;

    color:var(--green);

    border:1px solid rgba(0,255,136,.25);

    border-radius:18px;

    padding:18px;

    outline:none;

    font-family:monospace;

    font-size:15px;

    letter-spacing:1px;

    transition:.25s;

}

textarea:focus{

    border-color:var(--green);

    box-shadow:
        0 0 30px rgba(0,255,136,.12);

}

button{

    width:100%;

    border:0;

    padding:17px;

    margin-top:18px;

    border-radius:15px;

    background:
        linear-gradient(135deg,#00ff88,#00a85b);

    color:#00190d;

    font-family:'Kanit';

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 15px 40px rgba(0,255,136,.18);

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.result{

    margin-top:20px;

}

.result-box{

    border:1px solid rgba(0,255,136,.3);

    background:#050805;

    border-radius:18px;

    padding:20px;

    animation:pop .4s;

}

.result-box.error{

    border-color:var(--red);

}

@keyframes pop{

    from{
        transform:scale(.92);
        opacity:0;
    }

    to{
        transform:none;
        opacity:1;
    }

}

.success{

    color:var(--green);

}

.error{

    color:var(--red);

}

.code{

    font-family:monospace;

    word-break:break-all;

}

.small{

    color:#73877d;

    font-size:13px;

}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>REDEEM CODE</h1>

        <div class="subtitle">
            กรอกรหัสลับ 40 ตัว เพื่อรับสินค้า
        </div>

        <label>
            SECRET CODE
        </label>

        <textarea
            id="codeInput"
            maxlength="40"
            placeholder="วางรหัส 40 ตัวที่นี่..."
            autocomplete="off"
            spellcheck="false"
        ></textarea>

        <button
            id="redeemButton"
            onclick="redeem()"
        >
            🔓 ยืนยันรหัส
        </button>

        <div id="result" class="result"></div>

    </div>

</div>

<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbxKEiEOPfuaTGGnCuRk50PLCSQJpQ1WQ_8PkR9Y_J3VF7YvaZ09nFQOsBjRfV9qugTu/exec";


const codeInput=
    document.getElementById("codeInput");


codeInput.addEventListener(
    "paste",
    ()=>{
        setTimeout(()=>{
            codeInput.value=
                codeInput.value
                .trim()
                .replace(/\s+/g,"");
        },10);
    }
);


async function redeem(){

    const code=
        codeInput.value
        .trim();

    const result=
        document.getElementById("result");

    const button=
        document.getElementById("redeemButton");


    if(!/^[A-Za-z0-9]{40}$/.test(code)){

        showError(
            "รหัสต้องมี 40 ตัว และประกอบด้วย A-Z, a-z และ 0-9 เท่านั้น"
        );

        playError();

        return;

    }


    if(
        !API_URL ||
        API_URL.includes("ใส่_URL")
    ){

        showError(
            "ยังไม่ได้ตั้งค่า Google Apps Script URL"
        );

        return;

    }


    button.disabled=true;

    button.textContent=
        "กำลังตรวจสอบ...";


    try{

        const response=
            await fetch(API_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:JSON.stringify({

                    action:"redeem",

                    code:code

                })

            });


        const data=
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "รหัสไม่ถูกต้อง"
            );

        }


        result.innerHTML=`

            <div class="result-box">

                <h2 class="success">
                    🎉 ยินดีด้วย!
                </h2>

                <p>
                    คุณได้รับ:
                    <b>${escapeHTML(data.product)}</b>
                </p>

                <p class="small">
                    Code ถูกใช้เรียบร้อยแล้ว
                </p>

            </div>

        `;

        playSuccess();


    }catch(error){

        showError(
            error.message ||
            "เกิดข้อผิดพลาด"
        );

        playError();

    }finally{

        button.disabled=false;

        button.textContent=
            "🔓 ยืนยันรหัส";

    }

}


function showError(message){

    document.getElementById("result")
        .innerHTML=`

        <div class="result-box error">

            <h3 class="error">
                ❌ ไม่สามารถใช้รหัสได้
            </h3>

            <p>
                ${escapeHTML(message)}
            </p>

        </div>

        `;

}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function playSuccess(){

    const ctx=
        new (window.AudioContext||
        window.webkitAudioContext)();

    const osc=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    osc.frequency.value=700;

    gain.gain.value=.12;

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.frequency.exponentialRampToValueAtTime(
        1200,
        ctx.currentTime+.35
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime+.6
    );

    osc.stop(
        ctx.currentTime+.6
    );

}


function playError(){

    const ctx=
        new (window.AudioContext||
        window.webkitAudioContext)();

    const osc=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    osc.type="sawtooth";

    osc.frequency.value=180;

    gain.gain.value=.12;

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.frequency.exponentialRampToValueAtTime(
        70,
        ctx.currentTime+.35
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime+.45
    );

    osc.stop(
        ctx.currentTime+.45
    );

}

</script>

</body>
</html>
