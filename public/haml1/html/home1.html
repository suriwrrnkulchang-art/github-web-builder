<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>หน้าหลัก</title>

    <link rel="stylesheet" href="../css/mai.css">

</head>


<body>


    <h3 class="h11">
        ในการเข้าวงการคุณต้องรู้รหัสลับในการเข้าวงการของพวกเรา
        โดยจะที่จะรู้รหัสผ่านลับพวกเรา
        ต้องคุยกับหัวหน้าโดยตรง
        ถ้าสุ่มผิดมากเกินไปพวกเราจะทำการแบน 10 นาที
    </h3>


    <div class="container">


        <!-- ปุ่มหลัก -->

        <button
            type="button"
            class="game-btn"
            id="soundBtn"
        >

            <img
                src="../png/Gemini_Generated_Image_gsmre6gsmre6gsmr.png"
                alt="Game Button Icon"
            >

        </button>



        <!-- =========================
             POPUP
        ========================== -->

        <div
            class="join-popup"
            id="joinPopup"
        >

            <div
                class="popup-content"
                id="popupContent"
            >

                <div class="popup-icon">
                    ⚠️
                </div>


                <h2>
                    แน่ใจใช่ไหม?
                </h2>


                <p>
                    แน่ใจใช่ไหมที่จะเข้าร่วมกับพวกเรา
                    <br>
                    คุณคิดดี ๆ นะ
                    <br>
                    ไม่งั้นอาจเสี่ยงได้เลยล่ะ
                </p>


                <div class="popup-buttons">


                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        ยกเลิก
                    </button>


                    <button
                        type="button"
                        class="confirm-btn"
                        id="confirmBtn"
                        disabled
                    >
                        ตกลง (10)
                    </button>


                </div>

            </div>

        </div>


    </div>



    <!-- ใช้ไฟล์เดียว -->

    <script src="../js/mama.js"></script>

</body>

</html>
